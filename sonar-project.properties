sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.css,**/*.md,**/package-lock.json,client/public/**,client/src/main.jsx,client/src/test-utils.jsx,client/src/setupTests.js,server/data/**,docs/**,.ci-home/**,.npm-cache/**,.trivy-cache/**
